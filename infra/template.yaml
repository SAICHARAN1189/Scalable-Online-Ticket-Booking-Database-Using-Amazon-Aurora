AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Scalable Online Ticket Booking Database Using Amazon Aurora PostgreSQL.
  Deploys an Aurora PostgreSQL cluster with one writer and one Aurora replica
  (using Aurora Serverless v2 for cost efficiency), security groups with
  restricted access, and AWS Secrets Manager credential management.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0a2c8457f7958f9c9
    Description: Existing VPC ID for the database subnet group.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0cc11bd0e48ac15be,subnet-0fb02be34fa594645,subnet-0505325230ab51f43
    Description: List of at least two Subnet IDs in different Availability Zones within the VPC.

  AllowedCidr:
    Type: String
    Default: 172.31.0.0/16
    Description: >
      IPv4 CIDR block allowed to connect to PostgreSQL port 5432.
      Must NOT be 0.0.0.0/0. Defaults to VPC CIDR or provide your local machine public CIDR (e.g., 203.0.113.5/32).
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    ConstraintDescription: Must be a valid IPv4 CIDR range (e.g., 172.31.0.0/16 or 203.0.113.5/32).

  DBName:
    Type: String
    Default: auroratickets
    Description: Name of the default database to create.
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9_]*$
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters or underscores.

  DBMasterUsername:
    Type: String
    Default: auroraadmin
    Description: Master username for Aurora PostgreSQL.
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9_]*$
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters or underscores.

  EngineVersion:
    Type: String
    Default: "16.8"
    Description: Aurora PostgreSQL engine version. ap-south-1 supports 16.8 with Serverless v2.

  MinACU:
    Type: Number
    Default: 0.5
    MinValue: 0.5
    MaxValue: 128
    Description: Minimum Aurora Serverless v2 Capacity Units (ACUs). 0.5 ACU is the minimum and most cost-effective.

  MaxACU:
    Type: Number
    Default: 2.0
    MinValue: 0.5
    MaxValue: 128
    Description: Maximum Aurora Serverless v2 Capacity Units (ACUs) during peak workload.

  PubliclyAccessible:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Set to true only if connecting directly from outside VPC (e.g., local workstation) with AllowedCidr restricted.
      Set to false if running Flask on an EC2 instance / bastion within the VPC.

Resources:
  # -------------------------------------------------------------
  # Secure Database Master Password in AWS Secrets Manager
  # -------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-aurora-master-secret"
      Description: Master credentials for Aurora PostgreSQL Ticket Booking cluster
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DBMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: "\"@/\\' "
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Environment
          Value: AcademicDemo

  # -------------------------------------------------------------
  # Security Group: STRICTLY RESTRICTED - NEVER 0.0.0.0/0
  # -------------------------------------------------------------
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora Ticket Booking PostgreSQL cluster
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref AllowedCidr
          Description: PostgreSQL connection from authorized CIDR only
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  # -------------------------------------------------------------
  # Aurora DB Subnet Group across multiple AZs
  # -------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Multi-AZ Subnet group for Aurora Ticket Booking cluster
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Name
          Value: !Sub "${AWS::StackName}-subnet-group"

  # -------------------------------------------------------------
  # Aurora PostgreSQL DB Cluster
  # -------------------------------------------------------------
  DBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinACU
        MaxCapacity: !Ref MaxACU
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Name
          Value: !Sub "${AWS::StackName}-cluster"

  # -------------------------------------------------------------
  # Primary DB Instance: Aurora Writer
  # -------------------------------------------------------------
  DBWriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceIdentifier: !Sub "${AWS::StackName}-writer"
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: !Ref PubliclyAccessible
      PromotionTier: 0
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Role
          Value: Writer
        - Key: Name
          Value: !Sub "${AWS::StackName}-writer"

  # -------------------------------------------------------------
  # Read Replica: Aurora Reader Instance
  # -------------------------------------------------------------
  DBReaderReplicaInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: DBWriterInstance
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceIdentifier: !Sub "${AWS::StackName}-replica-1"
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: !Ref PubliclyAccessible
      PromotionTier: 1
      Tags:
        - Key: Project
          Value: AuroraTicketBooking
        - Key: Role
          Value: ReaderReplica
        - Key: Name
          Value: !Sub "${AWS::StackName}-replica-1"

Outputs:
  ClusterWriterEndpoint:
    Description: Aurora Writer endpoint for all mutations (INSERTS, UPDATES, DELETES, Bookings, Cancellations)
    Value: !GetAtt DBCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-WriterEndpoint"

  ClusterReaderEndpoint:
    Description: Aurora Reader endpoint load-balancing read traffic across Aurora replicas
    Value: !GetAtt DBCluster.ReadEndpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-ReaderEndpoint"

  DatabasePort:
    Description: Aurora PostgreSQL Database Port
    Value: !GetAtt DBCluster.Endpoint.Port

  DatabaseName:
    Description: Database Name
    Value: !Ref DBName

  DBSecretArn:
    Description: AWS Secrets Manager Secret ARN holding master credentials
    Value: !Ref DBSecret

  DBSecurityGroupId:
    Description: Security Group ID securing the database cluster
    Value: !Ref DBSecurityGroup
